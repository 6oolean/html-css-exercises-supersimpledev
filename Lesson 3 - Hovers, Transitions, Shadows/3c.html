<!-- GitHub with hovers and transitions-->

<style>
  .github{
    background-color: rgb(46, 164, 79);
    color: white;
    font-weight: bold;
    border-style: none;
    border-radius: 5px;
    height: 35px;
    width: 85px;
    cursor: pointer;
    transition: box-shadow 0.15s;
  }

  .github:hover{
    box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
  }
</style>

<button class="github">
  Sign up
</button>
