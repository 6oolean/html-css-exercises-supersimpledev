<!-- Bootstrap with hovers and transitions -->
 
<style>
  .bootstrap{
    background-color: rgb(121, 82, 179);
    color: white;
    border-style: none;
    border-radius: 5px;
    height: 45px;
    width: 110px;
    font-weight: bold;
    margin-right: 8px;
    cursor: pointer;
    transition: background-color 0.15s;
  }

  .bootstrap:hover{
    background-color: rgb(85, 45, 145);
  }

  .download{
    background-color: white;
    color: rgb(108, 117, 125);
    border-color: rgb(108, 117, 125);
    border-radius: 5px;
    border-style: solid;
    height: 45px;
    width: 110px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }

  .download:hover{
    background-color:  rgb(108, 117, 125);
    color: white;
  }
</style>

<button class="bootstrap">
  Get started
</button>

<button class="download">
  Download
</button>
