<!-- LinkedIn with hovers and transitions-->

<style>
  .apply{
    background-color: rgb(10, 102, 194);
    border-style: none;
    border-radius: 20px;
    color: white;
    font-weight: bold;
    height: 40px;
    width: 210px;
    margin-right: 8px;
    cursor: pointer;
    transition: background-color 0.15s;
  }

  .apply:hover{
    background-color: rgb(6, 72, 137);
  }

  .save{
    background-color: white;
    border-style: solid;
    border-color: rgb(10, 102, 194);
    border-radius: 20px;
    color: rgb(10, 102, 194);
    font-weight: bold;
    height: 40px;
    width: 80px;
    cursor: pointer;
    transition: background-color 0.15s;
  }

  .save:hover{
    background-color: rgb(165, 200, 236);
    border-width: 3px;
  }
</style>

<button class="apply">
  Apply on company website
</button>

<button class="save">
  Save
</button>
